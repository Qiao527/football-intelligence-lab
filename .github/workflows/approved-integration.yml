name: Approved FIL-003–005 integration

# Deliberately dispatch-only and restricted to the one owner-authorized integration.
# Install/review on main and enable PR creation by GITHUB_TOKEN before use.
on:
  workflow_dispatch:
    inputs:
      approved_head:
        description: Exact reviewed 40-character head of integrate/fil-003-005
        required: true
        type: string

permissions: {}
concurrency:
  group: approved-fil-integration
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Qiao527/football-intelligence-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: integrate/fil-003-005
          persist-credentials: false
      - name: Require exact reviewed integration head
        env:
          APPROVED_HEAD: ${{ inputs.approved_head }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$APPROVED_HEAD"
          test -f docs/reports/INTEGRATION.md
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Verify without write credentials
        run: |
          uv python install
          uv lock --check
          uv sync --frozen
          uv run --frozen ruff check .
          uv run --frozen pytest -q
          uv build
          UV_PROJECT_ENVIRONMENT=.venv-regular uv sync --frozen --no-editable
          UV_PROJECT_ENVIRONMENT=.venv-regular uv run --frozen --no-editable pytest -q
  deliver:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APPROVED_HEAD: ${{ inputs.approved_head }}
    steps:
      - name: Create the one approved integration PR, preserving all branch protections
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          actual=$(gh api repos/$GH_REPO/git/ref/heads/integrate/fil-003-005 --jq .object.sha)
          test "$actual" = "$APPROVED_HEAD"
          number=$(gh pr list --base main --head integrate/fil-003-005 --json number --jq '.[0].number // empty')
          if test -z "$number"; then
            gh pr create --base main --head integrate/fil-003-005 \
              --title 'Integrate reviewed FIL-003–005' \
              --body 'Owner-authorized integration only. See docs/reports/INTEGRATION.md for source, review and real-match evidence. Existing PRs remain intact.'
            number=$(gh pr list --base main --head integrate/fil-003-005 --json number --jq '.[0].number')
          fi
          gh pr view "$number" --json headRefOid,mergeable,mergeStateStatus > state.json
          jq -e --arg sha "$APPROVED_HEAD" \
            '.headRefOid == $sha and .mergeable == "MERGEABLE" and .mergeStateStatus == "CLEAN"' state.json
          # GITHUB_TOKEN-created PRs do not trigger new PR workflows. Require existing
          # protected required checks from the push; never treat zero checks as success.
          gh pr checks "$number" --required --json name,bucket > checks.json
          jq -e 'length > 0 and all(.[]; .bucket == "pass")' checks.json
          gh pr merge "$number" --squash --match-head-commit "$APPROVED_HEAD"
