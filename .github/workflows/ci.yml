name: Engineering foundation

on:
  push:
    branches: [main, "feat/**", "integrate/**", "research/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Install pinned Python
        run: uv python install
      - name: Check manifest and lock agreement
        run: uv lock --check
      - name: Install from frozen lockfile
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Test installed editable package
        run: uv run --frozen pytest -q
      - name: Build wheel and source distribution
        run: uv build
      - name: Test regular installation from empty environment
        env:
          UV_PROJECT_ENVIRONMENT: .venv-wheel
        run: |
          uv sync --frozen --no-editable --reinstall-package football-intelligence-lab
          uv run --frozen --no-editable ruff check .
          uv run --frozen --no-editable pytest -q
          uv run --frozen --no-editable python -m fil.ingestion.normalize --help
          uv run --frozen --no-editable python -m fil.time --help
          uv run --frozen --no-editable python -m fil.metrics.score_cli --help
          uv run --frozen --no-editable python -m fil.explorer --help
          uv run --frozen --no-editable python -m fil.explorer.data --help
          uv run --frozen --no-editable python -m fil.explorer.tactical_data --help
          uv run --frozen --no-editable python -m fil.possessions.artifacts --help
          uv run --frozen --no-editable python -m fil.explorer.player_data --help
          uv run --frozen --no-editable python -m fil.research --help
          uv run --frozen --no-editable python -m fil.research.worldcup --help
          uv run --frozen --no-editable python -m fil.research.integrity_review --help
          uv run --frozen --no-editable python -m fil.research.metric_review --help
          uv run --frozen --no-editable python -m fil.research.corpus_expansion --help
          uv run --frozen --no-editable python -m fil.research.corpus_baselines --help
          uv run --frozen --no-editable python -m fil.research.complete_corpus --help
          uv run --frozen --no-editable python -m fil.research.accepted_corpus --help
