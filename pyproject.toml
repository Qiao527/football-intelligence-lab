[project]
name = "football-intelligence-lab"
version = "0.1.0"
description = "Evidence-traceable football research tooling (engineering foundation)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pyarrow==21.0.0",
]

[build-system]
requires = ["uv_build==0.9.5"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.0"]

[tool.uv]
required-version = "==0.12.23"

[tool.uv.build-backend]
module-name = "fil"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers"
filterwarnings = ["error"]
